<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>Fanis Dance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{
  --sky:#5c94fc;
  --ink:#ffffff;
  --ink-shadow:#1b2a6b;
  --title:#ffd35a;
  --title-shadow:#b33d27;
  --edge:#17121a;
  --panel:#ffffff;
  --panel-ink:#17121a;
  --floor-ink:#ffffff;
  --floor-shadow:#000000;
  --gold:#ffd35a;
  --tile:#3a3060;
  --tile-dim:#6b6388;
  --judge-good:#ffffff;
  --judge-miss:#ff8f8f;
  --scrim:rgba(12,9,24,.94);
  --p1:#ff4f7b;
  --p2:#4fd8ff;
  --info-bg:rgba(12,9,24,.72);
  --slot:clamp(40px, min(calc((100vw - 64px) / 5), calc((100vh - 560px) / 3)), 64px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sky:#0b0b1e; --ink-shadow:#000000; color-scheme:dark; }
}
:root[data-theme="dark"]{ --sky:#0b0b1e; --ink-shadow:#000000; color-scheme:dark; }

html,body{height:100%;overflow:hidden}
body{
  margin:0;background:var(--sky);color:var(--ink);
  font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;
  touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
#stage{position:fixed;top:0;display:block;image-rendering:crisp-edges;image-rendering:pixelated;cursor:pointer;outline:none}

.pix{
  pointer-events:auto;touch-action:manipulation;cursor:pointer;
  font:inherit;font-size:10px;letter-spacing:.05em;color:var(--panel-ink);background:var(--panel);
  border:0;border-radius:0;min-height:44px;padding:0 12px;margin:4px;
  box-shadow:0 -4px 0 0 var(--edge),0 4px 0 0 var(--edge),-4px 0 0 0 var(--edge),4px 0 0 0 var(--edge);
}
.pix:active{transform:translateY(2px)}
.pix:focus-visible,.slot:focus-visible{outline:3px dashed var(--title);outline-offset:8px}

.hud{
  position:fixed;left:0;right:0;top:0;z-index:3;pointer-events:none;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 16px) 0 calc(env(safe-area-inset-left,0px) + 16px);
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.bar{align-self:stretch;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar .spacer{flex:1}
h1{
  margin:0;font-weight:400;line-height:1;letter-spacing:.08em;white-space:nowrap;
  color:var(--title);text-shadow:4px 4px 0 var(--title-shadow),8px 8px 0 var(--edge);
}
#hint{margin:0;font-size:11px;line-height:1.6;letter-spacing:.05em;text-shadow:2px 2px 0 var(--ink-shadow)}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.select{
  position:fixed;inset:0;z-index:2;pointer-events:none;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 68px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 18px) calc(env(safe-area-inset-left,0px) + 16px);
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.select h2{
  margin:0;font-weight:400;font-size:clamp(13px,4.4vw,22px);line-height:1.5;letter-spacing:.05em;text-wrap:balance;
  color:var(--title);text-shadow:3px 3px 0 var(--title-shadow),5px 5px 0 var(--edge);pointer-events:auto;
}
.grid{display:grid;grid-template-columns:repeat(5,var(--slot));gap:8px;pointer-events:auto}
.slot{
  position:relative;width:var(--slot);height:var(--slot);padding:0;border:0;border-radius:0;cursor:pointer;
  background:var(--tile);touch-action:manipulation;
  box-shadow:0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge);
}
.slot canvas{display:block;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated}
.slot.soon{background:#262040}
.slot.on{box-shadow:0 -4px 0 0 var(--gold),0 4px 0 0 var(--gold),-4px 0 0 0 var(--gold),4px 0 0 0 var(--gold);animation:glow .6s steps(1) infinite}
@keyframes glow{50%{box-shadow:0 -4px 0 0 var(--title-shadow),0 4px 0 0 var(--title-shadow),-4px 0 0 0 var(--title-shadow),4px 0 0 0 var(--title-shadow)}}
.slot .q{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--slot) * .34);color:#8f86b8;text-shadow:2px 2px 0 var(--edge)}
.slot .new{position:absolute;top:-8px;right:-8px;font-size:7px;padding:3px 4px;background:var(--gold);color:var(--edge)}
.info{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:34em}
#selName{font-size:clamp(14px,4.4vw,20px);color:var(--floor-ink);text-shadow:3px 3px 0 var(--floor-shadow)}
#selTag{font-size:9px;line-height:1.6;color:var(--gold);text-shadow:2px 2px 0 var(--floor-shadow)}
#selReq{font-size:8px;line-height:1.8;color:var(--floor-ink);text-shadow:2px 2px 0 var(--floor-shadow);min-height:1.8em}
.btns{margin-top:auto;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
#go{font-size:14px;min-height:52px;padding:0 20px;background:var(--gold)}
#duel{font-size:12px;min-height:52px;padding:0 14px}
#go:disabled,#duel:disabled{background:var(--tile-dim);color:var(--tile);cursor:default;transform:none}
.slot .p1{position:absolute;top:-8px;left:-8px;font-size:7px;padding:3px 4px;background:var(--p1);color:var(--edge)}

@media (min-aspect-ratio: 6/5){
  :root{--slot:clamp(40px, min(calc((min(52vw, 520px) - 80px) / 5), calc((100vh - 330px) / 3)), 72px)}
  .select{right:auto;width:min(52vw,520px);justify-content:center}
  .btns{margin-top:4px}
  .info{background:var(--info-bg);padding:12px 16px}
}

.low{
  position:fixed;left:0;right:0;bottom:0;pointer-events:none;text-align:center;
  padding:0 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
#move{font-size:clamp(14px,5vw,26px);min-height:1.2em;color:var(--floor-ink);text-shadow:3px 3px 0 var(--floor-shadow)}
.pop{animation:pop .4s steps(4)}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#combo{font-size:9px;line-height:1.6;min-height:1em;color:var(--gold);text-shadow:2px 2px 0 var(--floor-shadow);font-variant-numeric:tabular-nums}

#bubble{
  position:fixed;left:0;top:0;z-index:4;pointer-events:none;white-space:nowrap;
  background:var(--panel);color:var(--panel-ink);font-size:10px;line-height:1.4;padding:8px 10px;
  box-shadow:0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge);
}
#bubble::after{
  content:"";position:absolute;left:calc(50% - 3px);bottom:-6px;width:6px;height:6px;background:var(--panel);
  box-shadow:-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 3px 0 0 var(--edge);
}
.judge{
  position:fixed;z-index:4;pointer-events:none;font-size:11px;white-space:nowrap;transform:translate(0,-50%);
  text-shadow:2px 2px 0 var(--floor-shadow);animation:rise .65s steps(6) forwards;
}
.judge.p{color:var(--gold)} .judge.g{color:var(--judge-good)} .judge.m{color:var(--judge-miss)}
@keyframes rise{to{transform:translate(0,-180%);opacity:0}}

#banner{
  position:fixed;left:50%;top:40%;z-index:6;transform:translate(-50%,-50%);pointer-events:none;
  width:max-content;max-width:calc(100vw - 48px);text-align:center;padding:18px 20px;
  background:var(--edge);color:var(--floor-ink);
  box-shadow:0 -4px 0 0 var(--gold),0 4px 0 0 var(--gold),-4px 0 0 0 var(--gold),4px 0 0 0 var(--gold);
}
#banner:not([hidden]){animation:flash .3s steps(1) 4}
@keyframes flash{50%{background:var(--title-shadow)}}
#bTop{font-size:10px;line-height:1.6;color:var(--gold)}
#bName{font-size:clamp(18px,6vw,30px);margin:12px 0;line-height:1.2}
#bSub{font-size:8px;line-height:1.8}
.bend{
  position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
  padding:0 16px calc(env(safe-area-inset-bottom,0px) + 22px);
}
#rematch{font-size:12px;min-height:52px;background:var(--gold)}
#bExit{font-size:12px;min-height:52px}
#toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);z-index:6;transform:translateX(-50%);pointer-events:none;
  background:var(--gold);color:var(--edge);font-size:9px;line-height:1.6;padding:8px 12px;white-space:nowrap;
  box-shadow:0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge);
}
.panel{
  position:fixed;inset:0;z-index:8;background:var(--scrim);display:flex;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
}
.panel-in{outline:none;width:min(100%,520px);display:flex;flex-direction:column;gap:16px;overflow:auto;padding:8px}
.panel h2{
  margin:0;font-weight:400;font-size:clamp(16px,5vw,24px);line-height:1.4;text-align:center;
  color:var(--title);text-shadow:3px 3px 0 var(--title-shadow),5px 5px 0 var(--edge);
}
.sub{margin:0;font-size:9px;letter-spacing:.05em;color:var(--gold)}
.bests{display:grid;grid-template-columns:1fr auto;gap:10px 16px;margin:0;font-size:9px;line-height:1.5;color:var(--floor-ink)}
.bests dd{margin:0;color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tlist li{display:flex;gap:14px;align-items:center;padding:10px 12px;background:var(--tile)}
.tlist li.off{background:#262040}
.medal{flex:none;width:18px;height:18px;background:var(--gold);box-shadow:0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge)}
.tlist li.off .medal{background:var(--tile-dim)}
.tname{font-size:10px;line-height:1.5;color:var(--floor-ink)}
.tdesc{font-size:8px;line-height:1.7;color:#cfc8ea}
.tlist li.off .tname{color:#a79fc9}
#tclose{align-self:center;background:var(--gold)}
@media (prefers-reduced-motion: reduce){ .blink,.pop,.slot.on,#banner:not([hidden]){animation:none} .judge{animation-timing-function:steps(1)} }
</style>

<canvas id="stage" tabindex="0" aria-label="8-bit dance stage. Tap the dancer's head, or press Space, to dance."></canvas>
<div class="hud">
  <div class="bar">
    <button id="back" class="pix" type="button" hidden>&lt; FIGHTERS</button>
    <button id="trophyBtn" class="pix" type="button">TROPHIES</button>
    <span class="spacer"></span>
    <button id="mute" class="pix" type="button">SOUND ON</button>
  </div>
  <h1 id="title" hidden>FANIS</h1>
  <p id="hint" class="blink" hidden>TAP HIS HEAD</p>
</div>
<div id="select" class="select">
  <h2 id="selTitle">CHOOSE YOUR FIGHTER</h2>
  <div id="grid" class="grid" role="group" aria-label="Fighters"></div>
  <div class="info">
    <div id="selName"></div>
    <div id="selTag"></div>
    <div id="selReq"></div>
  </div>
  <div class="btns">
    <button id="go" class="pix" type="button">DANCE!</button>
    <button id="duel" class="pix" type="button">DANCE-OFF</button>
  </div>
</div>
<div id="low" class="low" hidden><div id="move" aria-live="polite"></div><div id="combo"></div></div>
<div id="bEnd" class="bend" hidden>
  <button id="rematch" class="pix" type="button">REMATCH</button>
  <button id="bExit" class="pix" type="button">FIGHTERS</button>
</div>
<div id="bubble" hidden></div>
<div id="toast" role="status" hidden></div>
<div id="banner" hidden><div id="bTop"></div><div id="bName"></div><div id="bSub"></div></div>
<div id="trophies" class="panel" role="dialog" aria-modal="true" aria-labelledby="tTitle" hidden>
  <div id="tPanel" class="panel-in" tabindex="-1">
    <h2 id="tTitle">TROPHIES</h2>
    <p class="sub">PERSONAL BESTS ON THIS PHONE</p>
    <dl id="bests" class="bests"></dl>
    <p id="tCount" class="sub"></p>
    <ul id="tlist" class="tlist"></ul>
    <button id="tclose" class="pix" type="button">CLOSE</button>
  </div>
</div>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const cv = $('stage'), mainG = cv.getContext('2d');
let g = mainG;
const E = {
  back: $('back'), mute: $('mute'), title: $('title'), hint: $('hint'), select: $('select'), selTitle: $('selTitle'),
  grid: $('grid'), selName: $('selName'), selTag: $('selTag'), selReq: $('selReq'), go: $('go'),
  low: $('low'), move: $('move'), combo: $('combo'), bubble: $('bubble'),
  banner: $('banner'), bTop: $('bTop'), bName: $('bName'), bSub: $('bSub'),
  trophyBtn: $('trophyBtn'), duel: $('duel'), bEnd: $('bEnd'), rematch: $('rematch'), bExit: $('bExit'), toast: $('toast'),
  trophies: $('trophies'), bests: $('bests'), tCount: $('tCount'), tlist: $('tlist'), tclose: $('tclose'),
};
const pick = a => a[Math.random() * a.length | 0];
const perf = () => performance.now() / 1000;
const mod = (a, n) => ((a % n) + n) % n;
const fmtTime = sec => { const s = Math.floor(sec); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

/* ================= Sprites ================= */
const K = '#17121a', GLASS = '#22304f', SIL_COL = '#1f1834';
const PARTY = ['#ff4f7b', '#ffd35a', '#4fd8ff', '#8cff5a', '#b36bff', '#ff8a3d'];

// Heads are 14 wide. Letters map through each fighter's palette; k is always the outline.
const FANIS_HEAD = [
  '...kkkkkkkk...',
  '..khhhhhhhhk..',
  '.khhhhhhhhhhk.',
  '.khshhhhhhshk.',
  '.kssssssssssk.',
  '.kssssssssssk.',
  '.kshhsssshhsk.',
  'kSssksssskssSk',
  'kSbsssSSsssbSk',
  '.kbbsbbbbsbbk.',
  '.kbbbbmmbbbbk.',
  '..kbbbbbbbbk..',
  '...kkkkkkkk...',
];
const AMARILDO_HEAD = [ // two rows of quiff above the usual head top
  '....kkkkk.....',
  '...khHHHhk....',
  '..khhHHhhhkk..',
  '.khhhhHhhhhhk.',
  '.khhhhhhhhhhk.',
  '.kShhhhhhhhSk.',
  '.kSssssssssSk.',
  '.kssssssssssk.',
  '.ksyyyssyyysk.',
  'kSysksyysksySk',
  'kSsyyySSyyysSk',
  '.ktsssssssstk.',
  '.ktsssmmssstk.',
  '..kttttttttk..',
  '...kkkkkkkk...',
];
const EMY_HEAD = [
  '...kkkkkkkk...',
  '..kHhdHHdhHk..',
  '.khHdhhhhdHhk.',
  '.kHdhHhhHhdHk.',
  '.khdssssssdhk.',
  '.khsssssssshk.',
  '.khddssssddhk.',
  '.khsksssskshk.',
  '.kssssSSssssk.',
  'eksrssssssrske',
  '.kssssllssssk.',
  '..kssssssssk..',
  '...kkkkkkkk...',
];
// Silhouettes for the fighters still to come; the outline is added at load.
const MASKS = [
  ['..............', '....######....', '...########...', '...########...', '.##########...', '...########...', '...########...', '...########...', '...########...', '...########...', '....######....', '.....####.....', '..............'],
  ['..............', '.....####.....', '......##......', '...########...', '...########...', '...########...', '...########...', '...########...', '...########...', '...########...', '....######....', '.....####.....', '..............'],
  ['..............', '....######....', '...########...', '..##########..', '..##########..', '..##########..', '..##########..', '..##########..', '..##########..', '..##########..', '..##########..', '..###....###..', '..............'],
  ['..............', '...########...', '..##########..', '.############.', '.############.', '.############.', '..##########..', '...########...', '...########...', '...########...', '....######....', '.....####.....', '..............'],
  ['..............', '...#..##..#...', '...##.##.##...', '...########...', '..##########..', '...########...', '...########...', '...########...', '...########...', '...########...', '....######....', '.....####.....', '..............'],
].map(rows => rows.map((row, r) => [...row].map((ch, c) => {
  if (ch === '#') return 'h';
  const at = (y, x) => rows[y] && rows[y][x] === '#';
  return at(r - 1, c) || at(r + 1, c) || at(r, c - 1) || at(r, c + 1) ? 'k' : '.';
}).join('')));
const LOCK = ['.###.', '#...#', '#####', '##.##', '#####'];
const NOTE = ['..##.', '..#.#', '..#..', '.##..', '###..', '.#...'];
const STAR = ['.#.', '###', '.#.'];
const PLATE = ['.###.', '#####'];

// Limbs are written for the dancer's left side (screen left) and mirrored for the right.
// Arm: [elbow out, elbow down, hand out, hand down] from the shoulder. Out = away from the body.
const ARM = {
  D: [1, 4, 1, 8], U: [2, -4, 3, -9], O: [4, 0, 8, 0], H: [4, 3, 1, 7],
  PU: [3, -3, 7, -8], PD: [3, 3, 7, 7], X: [-1, 5, -5, 7], G: [4, 0, 4, -5], B: [4, 0, 4, 5],
  F: [3, -1, -3, -5], HD: [4, -3, 2, -8], PF: [2, 3, 4, -1], W: [3, 3, 6, -1],
};
// Leg: [foot out, foot up, knee out].
const LEG = { S: [0, 0, 0], W: [2, 0, 0], Q: [2, 0, 2], K: [5, 4, 1], T: [1, 3, 2], C: [-3, 0, 0], P: [0, 1, 0], L: [1, 5, 3] };
const IDLE = { la: 'D', ra: 'D', ll: 'S', rl: 'S' };
const IDLE_BREATH = { la: 'D', ra: 'D', ll: 'S', rl: 'S', y: 1 };
const IDLE_TAP = { la: 'D', ra: 'D', ll: 'S', rl: 'P', hy: 1 };
const POKED = { la: 'H', ra: 'H', ll: 'W', rl: 'W' };

/* ================= Dances =================
   One pose per "hit" of the song (eighth notes in 4/4, the 3-2-2 steps in 7/8). hold = hits per pose. need = combo to unlock. */
const FANIS_MOVES = [
  { name: 'GROOVE', need: 0, poses: [
    { la: 'U', ra: 'D', ll: 'W', rl: 'W', hx: -1 }, { la: 'B', ra: 'B', ll: 'Q', rl: 'Q', y: 2 },
    { la: 'D', ra: 'U', ll: 'W', rl: 'W', hx: 1 }, { la: 'B', ra: 'B', ll: 'Q', rl: 'Q', y: 2 }] },
  { name: 'DISCO', need: 0, poses: [
    { la: 'H', ra: 'PU', ll: 'W', rl: 'S', x: -1, hx: 1 }, { la: 'H', ra: 'X', ll: 'W', rl: 'W', y: 1 },
    { la: 'H', ra: 'PU', ll: 'W', rl: 'S', x: -1, hx: 1 }, { la: 'H', ra: 'PD', ll: 'S', rl: 'W', y: 1 }] },
  { name: 'ROBOT', need: 0, poses: [
    { la: 'G', ra: 'B', ll: 'S', rl: 'W', x: -1, hx: -1 }, { la: 'B', ra: 'G', ll: 'W', rl: 'S', x: 1, hx: 1 }] },
  { name: 'JUMP', need: 3, poses: [
    { la: 'B', ra: 'B', ll: 'Q', rl: 'Q', y: 2 }, { la: 'U', ra: 'U', ll: 'T', rl: 'T', jump: -6 },
    { la: 'O', ra: 'O', ll: 'S', rl: 'S', jump: -3 }, { la: 'D', ra: 'D', ll: 'Q', rl: 'Q', y: 2 }] },
  { name: 'DAB', need: 3, hold: 2, poses: [
    { la: 'PU', ra: 'F', ll: 'W', rl: 'W', hx: 1, y: 1 }, { la: 'D', ra: 'D', ll: 'S', rl: 'S' },
    { la: 'F', ra: 'PU', ll: 'W', rl: 'W', hx: -1, y: 1 }, { la: 'D', ra: 'D', ll: 'S', rl: 'S' }] },
  { name: 'SIRTAKI', need: 6, say: 'OPA!', poses: [
    { la: 'O', ra: 'O', ll: 'S', rl: 'C', x: 1 }, { la: 'O', ra: 'O', ll: 'S', rl: 'K' },
    { la: 'O', ra: 'O', ll: 'C', rl: 'S', x: -1 }, { la: 'O', ra: 'O', ll: 'K', rl: 'S' }] },
];
const AMARILDO_MOVES = [
  { name: 'TOP ROCK', need: 0, poses: [
    { la: 'G', ra: 'X', ll: 'C', rl: 'S', y: 1 }, { la: 'B', ra: 'B', ll: 'S', rl: 'W' },

  const got = TROPHIES.filter(t => earned.has(t.id)).length;

  E.tlist.textContent = '';
  for (const t of TROPHIES) {
    const li = document.createElement('li'), m = document.createElement('span'), box = document.createElement('div');
    const n = document.createElement('div'), d = document.createElement('div');
    li.className = earned.has(t.id) ? '' : 'off'; m.className = 'medal'; n.className = 'tname'; d.className = 'tdesc';
    n.textContent = t.name; d.textContent = t.desc;
    box.append(n, d); li.append(m, box); E.tlist.appendChild(li);
  }
  E.trophies.hidden = false; const tp = $('tPanel'); tp.scrollTop = 0; tp.focus({ preventScroll: true });
}
function closeTrophies() { E.trophies.hidden = true; E.trophyBtn.focus(); }

/* ================= Fighter select ================= */
function portrait(cnv, c, st) {
  const pc = cnv.getContext('2d');
  pc.clearRect(0, 0, cnv.width, cnv.height);
  g = pc; SIL = st === 'open' ? null : SIL_COL; OX = -4; OY = 2;
  torso(c, 0);
  if (c.braid) braid(c, 0, 0);
  head(OX + 5, OY + (c.headDY || 0), c, 'idle');
  SIL = null;
  if (st === 'locked') sprite(LOCK, 10, 12, '#ffd35a');
  g = mainG;
}
function buildGrid() {
  E.grid.textContent = '';
  ROSTER.forEach((c, i) => {
    const st = status(c), b = document.createElement('button');
    b.type = 'button'; b.className = 'slot' + (st === 'soon' ? ' soon' : '');
    b.setAttribute('aria-label', st === 'soon' ? 'Coming soon' : c.name + (st === 'locked' ? ', locked' : ''));
    const cnv = document.createElement('canvas'); cnv.width = 16; cnv.height = 18;
    portrait(cnv, c, st);
    b.appendChild(cnv);
    const badge = (cls, text) => { const n = document.createElement('span'); n.className = cls; n.textContent = text; b.appendChild(n); };
    if (st === 'soon') badge('q', '?');
    if (fresh.has(c.id) && st === 'open') badge('new', 'NEW');
    if (pickP2 && i === p1Index) badge('p1', 'P1');
    b.addEventListener('click', () => onSlot(i));
    E.grid.appendChild(b);
  });
  markSel(); showInfo();
}
function markSel() { [...E.grid.children].forEach((b, i) => b.classList.toggle('on', i === selIndex)); }
function showInfo() {
  const c = ROSTER[selIndex], st = status(c);
  E.selTitle.textContent = pickP2 ? 'PLAYER 2: PICK YOUR FIGHTER' : 'CHOOSE YOUR FIGHTER';
  E.selName.textContent = st === 'soon' ? '???' : c.name;
  E.selTag.textContent = st === 'open' ? c.tag : st === 'locked' ? 'LOCKED' : 'STAY TUNED';
  E.selReq.textContent = st === 'locked' ? c.req + ' · ' + c.progress() : st === 'soon' ? 'A NEW FIGHTER IS WARMING UP'
    : pickP2 ? 'P1 IS ' + ROSTER[p1Index].name + '. SAME FIGHTER IS FINE.' : c.moves.length + ' MOVES · ' + c.moves.filter(m => m.need).length + ' UNLOCK WITH COMBOS';
  E.go.disabled = st !== 'open';
  E.go.textContent = st === 'open' ? (pickP2 ? 'FIGHT!' : 'DANCE!') : st === 'locked' ? 'LOCKED' : 'STAY TUNED';
  E.duel.hidden = pickP2; E.duel.disabled = st !== 'open';
  E.back.hidden = !pickP2; E.back.textContent = '< CANCEL'; E.trophyBtn.hidden = pickP2;
}
function choose() { // DANCE! / FIGHT!
  const c = ROSTER[selIndex];
  if (status(c) !== 'open') return;
  if (pickP2) startBattle(ROSTER[p1Index], c); else startPlay();
}
function onSlot(i) {
  startMusic();
  const c = ROSTER[i];
  if (i === selIndex && status(c) === 'open') { choose(); return; }
  selIndex = i; markSel(); showInfo(); sfx('blip');
  if (status(c) === 'open' && song !== c.song) setSong(c.song);
}
function moveSel(d) {
  selIndex = mod(selIndex + d, ROSTER.length); markSel(); showInfo(); sfx('blip');
  const c = ROSTER[selIndex];
  if (status(c) === 'open' && song !== c.song) setSong(c.song);
  E.grid.children[selIndex].focus();
}
function startPlay() {
  const c = ROSTER[selIndex];
  if (status(c) !== 'open') return;
  char = c; store.set('fanis_last', c.id);
  if (fresh.delete(c.id)) store.set('fanis_new', [...fresh]);
  mode = 'play';
  E.select.hidden = true; E.trophyBtn.hidden = true; E.back.hidden = false; E.back.textContent = '< FIGHTERS';
  E.title.hidden = false; E.hint.hidden = false; E.low.hidden = false; E.bEnd.hidden = true;
  E.title.textContent = c.name; fitTitle();
  hintText = null; setHint(c.hint, true);
  resetRun(); everDanced = false; lastNudge = perf(); wasDancing = false;
  setSong(c.song);
  measureHud();
  sfx('start');
}
function showSelect() {
  if (mode === 'play') endSession(true);
  mode = 'select'; battle = null; danceEnd = -1; wasDancing = false;
  E.select.hidden = false; E.title.hidden = true; E.hint.hidden = true; E.low.hidden = true; E.bEnd.hidden = true; E.bubble.hidden = true;
  buildGrid();
  const c = ROSTER[selIndex];
  if (status(c) === 'open' && song !== c.song) setSong(c.song);
  measureHud();
}
const charCX = () => mode === 'select' && innerWidth > innerHeight * 1.2 ? Math.round(LW * 0.74) : LW >> 1;

/* ================= Drawing the dancers ================= */
function drawSolo(s, T, dancing, shown, st) {
  const cx = charCX();
  if (mode === 'play' && dancing && combo >= 4) drawCrew(s, cx);
  const pose = poseFor(s, T, dancing, st);
  drawShadow(cx, pose.jump || 0);
  SIL = st === 'open' ? null : SIL_COL;
  geo = drawChar(shown, cx - 12, groundY - 34, pose, faceFor(s, T, dancing, st));
  SIL = null;
  if (mode === 'play' && dancing) drawTrack(s, cx, danceVisStart, danceEnd);
}
function drawCrew(s, cx) { // party mode: every other unlocked fighter backs you up, a step behind
  const crew = ROSTER.filter(c => c !== char && status(c) === 'open');
  if (!crew.length) return;
  if (!crewShown) { crewShown = true; popMove('PARTY MODE!'); award('crew'); }
  const off = Math.max(14, Math.min(22, Math.round(LW * 0.3))), face = mod(gridIndex(s, song.beats), 2) ? 'happy' : 'open';
  const line = char === EMY && move && LINE_MOVES.has(move.name); // Emy's circle dances: everyone joins the line
  crew.forEach((c, i) => {
    const x = cx + (i & 1 ? 1 : -1) * off * (1 + (i >> 1));
    const pose = line ? Object.assign({}, poseAt(move, s), { k: '' }) : poseAt(c.moves[mod(Math.floor(s / (song.bar * 2)) + i, 3)], s);
    drawShadow(x, pose.jump || 0, groundY - 3);
    drawChar(c, x - 12, groundY - 37, pose, face);
  });
}
function drawBattle(s, T, dancing) {
  const B = battle, xs = [Math.round(LW * 0.3), Math.round(LW * 0.7)];
  const act = B.phase === 'end' ? B.winner : B.turn;
  for (const i of act === 0 ? [1, 0] : [0, 1]) { // the active dancer is drawn last, on top
    const c = B.p[i];
    let pose, face;
    if (i === act && dancing && move) { pose = poseAt(move, s); face = faceFor(s, T, true, 'open'); }
    else if (B.phase === 'end' && B.winner >= 0 && i !== B.winner) { pose = POKED; face = 'surprised'; }
    else { pose = idlePose(s, T); face = T % 3.7 < 0.13 ? 'blink' : 'idle'; }
    drawShadow(xs[i], pose.jump || 0);
    const gg = drawChar(c, xs[i] - 12, groundY - 34, pose, face);
    if (i === Math.max(0, act)) geo = gg;
    const mx = xs[i], my = gg.y + gg.by + gg.dy - 6 - (i === act && Math.floor(T * 4) % 2 ? 1 : 0); // P1 / P2 marker
    g.fillStyle = K; g.fillRect(mx - 3, my - 1, 7, 4);
    g.fillStyle = i ? '#4fd8ff' : '#ff4f7b'; g.fillRect(mx - 2, my, 5, 1); g.fillRect(mx - 1, my + 1, 3, 1); g.fillRect(mx, my + 2, 1, 1);
  }
  if (B.phase === 'ready' || B.phase === 'go') drawTrack(s, LW >> 1, B.goStart, B.goEnd);
}

/* ================= Loop ================= */
let last = performance.now();
function frame(ms) {
  const dt = Math.min(0.1, Math.max(0, (ms - last) / 1000)); last = ms;
  const T = perf();
  tick();
  const s = Math.max(0, stepNow());
  if (mode === 'battle') battleStep(s, T);
  const playing = mode !== 'select', shown = playing ? char : ROSTER[selIndex], st = playing ? 'open' : status(shown);
  const dancing = playing && running && isDancing(s);

  if (dancing) {
    const span = song.bar * song.moveBars;
    if (!move || (Math.floor(s / span) !== Math.floor(moveStart / span) && s - moveStart >= span / 2)) pickMove(s);
    const beat = gridIndex(s, song.beats);
    if (beat !== lastBeat) { lastBeat = beat; spawn(geo.x + 12 + (beat & 1 ? 9 : -9), geo.y + geo.by + 12, 'note', 1); }
    const hit = gridIndex(s, song.hits), pose = poseAt(move, s);
    if (hit !== lastHit) {
      lastHit = hit;
      if (pose.plate) { const [px, py] = geo.hands[pose.plate]; parts.push({ x: px - 2, y: py - 1, kind: 'plate', age: 0, life: 3, vx: pose.plate === 'R' ? 18 : -18, vy: -25, c: '#f4f1ea' }); }
    }
    if (mode === 'play') {
      party = (s - danceVisStart) * STEP;
      if (party >= 60) { award('party'); if (!unlocked.has('emy')) { saveParty(); unlock('emy'); } }
      if (party >= 180) award('marathon');
      setCombo('COMBO x' + combo + '   STREAK x' + streak + '   ' + fmtTime(party));
    }
  }
  if (mode === 'play') {
    if (wasDancing && !dancing) endSession(false);
    setHint(dancing ? 'TAP ON THE BEAT!' : char.hint, !dancing);
    if (!everDanced && T - lastNudge > 7 && E.bubble.hidden) { say('PSST. TAP MY HEAD', 2); lastNudge = T; }
  }
  wasDancing = dancing;

  const night = isNight(), stage = shown.stage || 'village', pal = shown.floor || PARTY;
  if ((night ? 'n' : 'd') + stage !== bgKey) buildBg(night, stage);
  g.drawImage(bg, 0, 0);
  drawSky(T, night);
  drawBulbs(s, dancing, night);
  drawFloor(s, dancing, running && !dancing && beatPhase(s) < 1, pal);
  drawBall(s, dancing, dt, pal);
  if (mode === 'battle') drawBattle(s, T, dancing); else drawSolo(s, T, dancing, shown, st);
  stepParticles(dt);
  placeBubble();
  requestAnimationFrame(frame);
}

/* ================= Input ================= */
function hitTest(lx, ly) {
  const hx = geo.x + 5 + geo.hx, hy = geo.y + geo.by + geo.dy;
  if (lx >= hx - 2 && lx <= hx + 16 && ly >= hy - 4 && ly <= hy - geo.dy + 13) return 'head';
  if (lx >= geo.x + 1 && lx <= geo.x + 23 && ly >= geo.y + 13 && ly <= geo.y + 35) return 'body';
  return null;
}
addEventListener('pointerdown', e => {
  if (e.button > 0 || (e.target.closest && e.target.closest('button, .panel'))) return;
  const lx = (e.clientX - cvLeft) / P, ly = e.clientY / P;
  if (mode === 'battle') { battleTap(); return; } // in a dance-off any tap counts
  if (mode !== 'play') { startMusic(); spawn(lx, ly, 'star', 3); return; }
  const hit = hitTest(lx, ly);
  if (hit === 'head') headTap();
  else if (hit === 'body') poke();
  else { startMusic(); spawn(lx, ly, 'star', 3); }
});
// iOS only counts touchend/click as permission to start audio, so retry on those too.
for (const ev of ['pointerup', 'touchend', 'click', 'keyup']) addEventListener(ev, () => { if (started) resumeAudio(); updateMuteLabel(); }, { passive: true });
addEventListener('keydown', e => {
  if (!E.trophies.hidden) { if (e.key === 'Escape') closeTrophies(); return; }
  if (e.key === 'm' || e.key === 'M') { setMute(!muted); return; }
  const onButton = e.target.closest && e.target.closest('button');
  if (mode === 'select') {
    const d = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -5, ArrowDown: 5 }[e.key];
    if (d) { e.preventDefault(); startMusic(); moveSel(d); return; }
    if (e.key === 'Escape' && pickP2) { pickP2 = false; buildGrid(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && !onButton) { e.preventDefault(); startMusic(); choose(); }
    return;
  }
  if (e.key === 'Escape') { showSelect(); return; }
  if (onButton) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (mode === 'battle') battleTap(); else headTap(); }
});
addEventListener('contextmenu', e => e.preventDefault());
E.mute.addEventListener('click', () => { if (started && ctx && ctx.state !== 'running' && !muted) { resumeAudio(); return; } startMusic(); setMute(!muted); });
E.back.addEventListener('click', () => { sfx('blip'); if (mode === 'select') { pickP2 = false; buildGrid(); } else showSelect(); });
E.go.addEventListener('click', () => { startMusic(); choose(); });
E.duel.addEventListener('click', () => {
  startMusic();
  if (status(ROSTER[selIndex]) !== 'open') return;
  pickP2 = true; p1Index = selIndex; sfx('blip'); buildGrid();
});
E.rematch.addEventListener('click', () => { const [a, b] = battle.p; startBattle(a, b); });
E.bExit.addEventListener('click', () => { sfx('blip'); showSelect(); });
E.trophyBtn.addEventListener('click', () => { startMusic(); sfx('blip'); openTrophies(); });
E.tclose.addEventListener('click', closeTrophies);
E.selTitle.addEventListener('click', () => { // five quick taps on the title unlocks everyone
  const now = perf();
  titleTaps = titleTaps.filter(t => now - t < 2).concat(now);
  if (titleTaps.length >= 5) {
    titleTaps = [];
    ['amarildo', 'emy'].forEach(id => { if (!unlocked.has(id)) { unlocked.add(id); fresh.add(id); } });
    store.set('fanis_unlocked', [...unlocked]); store.set('fanis_new', [...fresh]);
    startMusic(); banner('CHEAT CODE', 'ALL FIGHTERS OPEN', 'NO SHAME'); sfx('unlock');
    award('squad'); buildGrid();
  }
});
addEventListener('resize', resize);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measureHud(); fitTitle(); });
setInterval(tick, 25);

resize();
setMute(muted);
showSelect();
requestAnimationFrame(frame);
})();

</script>
